name: example
description: Demonstrates how to use the sbb_data_scanner plugin.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.13.0 <4.0.0"
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter

  sbb_data_scanner:
    path: ../

  # https://pub.dev/packages/sbb_design_system_mobile
  sbb_design_system_mobile: ^6.0.0

  # https://pub.dev/packages/cupertino_icons
  cupertino_icons: ^1.0.9

dev_dependencies:
  flutter_test:
    sdk: flutter
  # https://pub.dev/packages/flutter_lints
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
